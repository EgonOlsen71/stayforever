<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<style>
@font-face { font-family: 'petscii';
src: url('CommodoreServer.ttf') format('truetype'); }
.con {
display:inline-block;
position:relative;
font-family:petscii, monospace;
font-size:min(1rem, 2.3vw);
line-height: 1.0;
width:40ch;
height:25em;
white-space:nowrap;
overflow:hidden;
}
.con.cursor-active::after {
content:"";
position:absolute;
left:var(--cursor-left);
top:var(--cursor-top);
width:1ch;
height:1em;
background-color:var(--cursor-color);
animation:cursor-blink 1s step-end infinite;
pointer-events:none;
}
@keyframes cursor-blink {
50% { opacity:0; }
}
</style>
<link id="theme-style" rel="stylesheet" href="c64.css">
<script>
var darkTheme=false;
try {darkTheme=localStorage.getItem('sf-theme')==='retro';} catch (e) {}
if (darkTheme) document.getElementById('theme-style').href='retro.css';
</script>
<script id='_compiledCode' src='sf.js' type='text/javascript'></script>
<script id='_console' src='console.js' type='text/javascript'></script>
<script type='text/javascript'>
var preout=function(txt) {document.getElementById('out').insertAdjacentHTML('beforeend',txt);};
// Use this to execute the code with output redirected into the pre-tag
//window.onload=function() {new Compiled(preout).execute();}
/*
// Use this to execute the code in a web worker
window.onload=function() {
executeAsync(document.getElementById('_compiledCode').src, function(e) {
console.log(e.data);
});
}
*/

// Use this to execute it in an onscreen, C64 like console with basic support for PETSCII
window.onload=function() {
var clientCon=new CbmConsoleClient(document.getElementById("con"));
var worker=executeAsync(document.getElementById('_compiledCode').src, function(e) {
if (Array.isArray(e.data)) {
clientCon.render(e.data[0], e.data[1], e.data[2], e.data[3], e.data[4], e.data[5]);
}
}, document.getElementById('con'));
var el=document.getElementById('con');
el.onkeydown = function(event) {
if (event.key=="Backspace" || event.key=="Enter") {
worker.postMessage([true, event.key, event.which || event.keyCode]);
event.preventDefault();
}
};
el.onkeypress = function(event) {
if (event.key=="Backspace" || event.key=="Enter") {
return;
}
worker.postMessage([true, event.key, event.which]);
event.preventDefault();
};
var mobileInput=document.getElementById('mobile-input');
document.querySelector('.screen').addEventListener('click', function(event) {
if (window.matchMedia('(pointer: coarse)').matches || event.pointerType==='touch') {
mobileInput.focus();
}
});
function sendMobileText() {
var text=mobileInput.value;
mobileInput.value='';
for (var i=0; i<text.length; i++) {
var key=text.charAt(i);
worker.postMessage([true, key==='\n' ? 'Enter' : key, key==='\n' ? 13 : key.charCodeAt(0)]);
}
}
mobileInput.addEventListener('keydown', function(event) {
if (event.isComposing || event.keyCode===229) return;
if (event.key==='Enter' || event.key==='Backspace') {
worker.postMessage([true, event.key, event.key==='Enter' ? 13 : 8]);
event.preventDefault();
}
});
mobileInput.addEventListener('beforeinput', function(event) {
if (event.isComposing || !event.cancelable) return;
if (event.inputType==='insertLineBreak' || event.inputType==='insertParagraph' || event.inputType==='deleteContentBackward') {
worker.postMessage([true, event.inputType==='deleteContentBackward' ? 'Backspace' : 'Enter', event.inputType==='deleteContentBackward' ? 8 : 13]);
event.preventDefault();
}
});
mobileInput.addEventListener('input', function(event) {
if (event.isComposing) return;
if (event.inputType==='deleteContentBackward') {
worker.postMessage([true, 'Backspace', 8]);
mobileInput.value='';
} else {
sendMobileText();
}
});
mobileInput.addEventListener('compositionend', function() {setTimeout(sendMobileText, 0);});
el.focus();
}

// Default, not a web worker and output into the console
//window.onload=function() {new Compiled().execute();}
</script>
</head>
<body>
<main class="cabinet">
  <header class="cabinet-header">
    <span>EgonOlsen</span>
    <label class="theme-toggle">
      <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode">
      <span class="theme-track" aria-hidden="true"></span>
      <span>DARK MODE</span>
    </label>
    <span>2025/2026</span>
  </header>
  <div class="marquee">
    <small>EIN ADVENTURE INSPIRIERT VON</small>
    <h1><a target="_blank" href="https://www.stayforever.de/">STAY FOREVER</a></h1>
    <p>DR&Uuml;CKE "ENTER" F&Uuml;R HILFE</p>
  </div>
  <section class="display" aria-label="Game display">
    <div class="display-top"><span class="power-light" aria-hidden="true"></span><span>COMMODORE 1084S</span><span>S-VIDEO</span></div>
    <div class="screen"><pre id="out"></pre><div tabindex="0" id="con" class="con"></div><textarea id="mobile-input" class="mobile-input" tabindex="-1" aria-label="Game keyboard input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></textarea></div>
  </section>
  <footer class="credit"><a target="_blank" href="https://github.com/EgonOlsen71/basicv2">Kompiliert mit MOSpeed</a></footer>
</main>
<script>
var themeToggle=document.getElementById('theme-toggle');
themeToggle.checked=darkTheme;
themeToggle.addEventListener('change', function() {
  document.getElementById('theme-style').href=this.checked ? 'retro.css' : 'c64.css';
  try {localStorage.setItem('sf-theme', this.checked ? 'retro' : 'c64');} catch (e) {}
});
</script>
</body>
</html>
